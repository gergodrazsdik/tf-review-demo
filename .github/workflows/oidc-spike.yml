---
name: oidc-spike

on:
  pull_request:

permissions:
  contents: read

jobs:
  through-reusable:
    # yamllint disable-line rule:line-length
    uses: gergodrazsdik/tf-review/.github/workflows/oidc-spike.yml@b0107dc39a82e8398ed6e4dced22e29c5e5ed339 # v0.0.0
    permissions:
      contents: read
      id-token: write

  # What a PR could add: a job of its own, in the review environment.
  attacker:
    runs-on: ubuntu-24.04
    environment: review
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Show this job's claims
        run: |
          token=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=tf-review-api" | jq -r .value)
          echo "::add-mask::$token"
          payload=$(cut -d. -f2 <<<"$token" | tr '_-' '/+')
          while [ $((${#payload} % 4)) -ne 0 ]; do payload="$payload="; done
          base64 -d <<<"$payload" | jq '{aud, iss, sub, repository, repository_id, event_name, ref, environment,
            job_workflow_ref, workflow_ref, runner_environment}'
