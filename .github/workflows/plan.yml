---
name: plan

on:
  pull_request:

permissions:
  contents: read

jobs:
  tf-review:
    uses: gergodrazsdik/tf-review/.github/workflows/tf-review.yml@bd22a24770ecaae4ddb7fad9e369965604c0cfba # v0.0.11
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    # Outage drill: a host that can never resolve stands in for the service being down. Don't merge.
    with:
      api-url: https://tf-review-api.invalid
    secrets: inherit
